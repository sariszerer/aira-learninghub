<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body { margin: 0; overflow-x: hidden; }
      @media (max-width: 640px) {
        /* Prevent horizontal overflow */
        #root { overflow-x: hidden; max-width: 100vw; }
        /* Modals full width */
        [class*="modal"], [style*="max-width: 620"], [style*="max-width: 580"], [style*="max-width: 520"] {
          max-width: 100vw !important; margin: 0 !important; border-radius: 16px 16px 0 0 !important;
        }
        /* Tabs scrollable */
        nav, [role="tablist"] { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      }
    </style>
    <title>AIRA Learning Hub</title>
    <!-- La "A" del logotipo, no el logotipo entero: es apaisado casi 2.4:1 y a
         32px se convertia en una mancha. Fondo transparente para que se lea en
         pestana clara y oscura; el de iOS va con fondo blanco porque alli la
         transparencia se compone sobre negro. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Como se ve el enlace al compartirlo por WhatsApp, que es como le llega
         a una madre el link para firmar. Sin esto salia el nombre a secas y el
         dominio de vercel, que no dice de que va ni tranquiliza a nadie.
         Son estaticas: la pagina no se genera en servidor, asi que la vista
         previa es la misma para cualquier enlace del sitio. Por eso la
         descripcion sirve tanto a quien entra al sistema como a quien abre un
         link de firma.
         og:image absoluta a proposito: WhatsApp no resuelve las relativas. -->
    <meta name="description" content="Acompañamiento terapéutico y de aprendizaje para niños y familias. Si recibiste este enlace del centro, ábrelo para firmar tu consentimiento informado." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AIRA Learning Hub" />
    <meta property="og:title" content="AIRA Learning Hub" />
    <meta property="og:description" content="Acompañamiento terapéutico y de aprendizaje para niños y familias. Si recibiste este enlace del centro, ábrelo para firmar tu consentimiento informado." />
    <meta property="og:image" content="https://aira-learninghub.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Aira Learning Hub" />
    <meta property="og:locale" content="es_ES" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="/assets/aira-app.js?v=1789143819"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
