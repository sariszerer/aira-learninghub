<!-- Plantilla base de los correos de AIRA.
     Los marcadores {{TITULO}}, {{CUERPO}}, {{ACCION}} y {{PIE}} los sustituye
     scripts/generar-plantillas-correo.mjs para producir cada plantilla final.

     Va con tablas y estilos EN LINEA a proposito, no con la hoja de estilos de
     la aplicacion: Outlook y Gmail descartan <style> del <head>, ignoran flex y
     grid, y recortan el CSS que no reconocen. Lo que aqui parece anticuado es
     lo unico que se ve igual en todos los clientes.

     Los colores son los tokens reales de src/theme.js. Si la marca cambia hay
     que tocar los dos sitios: un correo no puede importar el tema. -->
<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>{{TITULO}}</title>
  </head>
  <body style="margin:0; padding:0; background:#F7F8FA;">
    <!-- Texto de previsualizacion: es lo que se lee en la bandeja antes de
         abrir. Sin el, el cliente muestra el primer texto que encuentre. -->
    <div style="display:none; max-height:0; overflow:hidden; opacity:0;">{{PREVIO}}</div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F7F8FA;">
      <tr>
        <td align="center" style="padding:32px 16px;">

          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                 style="max-width:520px; background:#FFFFFF; border:1px solid #E5E7EB; border-radius:14px;">

            <!-- Franja de marca. Si el cliente bloquea la imagen del logo, esta
                 barra sigue identificando el correo. -->
            <tr><td style="background:#1E79E2; height:4px; line-height:4px; font-size:0; border-radius:14px 14px 0 0;">&nbsp;</td></tr>

            <tr>
              <td align="center" style="padding:28px 32px 4px;">
                <img src="{{LOGO}}" width="96" alt="AIRA Learning Hub"
                     style="display:block; width:96px; height:auto; border:0;" />
              </td>
            </tr>

            <tr>
              <td style="padding:18px 32px 0;">
                <h1 style="margin:0; font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:19px; line-height:1.35; font-weight:700; color:#111827;">
                  {{TITULO}}
                </h1>
              </td>
            </tr>

            <tr>
              <td style="padding:12px 32px 0; font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:14.5px; line-height:1.65; color:#374151;">
                {{CUERPO}}
              </td>
            </tr>

            {{ACCION}}

            <tr>
              <td style="padding:8px 32px 26px; font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:12.5px; line-height:1.6; color:#6B7280;">
                {{PIE}}
              </td>
            </tr>

            <tr><td style="padding:0 32px;"><div style="height:1px; background:#E5E7EB; line-height:1px; font-size:0;">&nbsp;</div></td></tr>

            <tr>
              <td style="padding:16px 32px 22px; font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:11.5px; line-height:1.6; color:#9CA3AF;">
                <strong style="color:#1E79E2;">AIRA Learning Hub</strong> · Ciudad de Panamá, Panamá<br />
                Este correo contiene un acceso personal. No lo reenvíes.
              </td>
            </tr>
          </table>

        </td>
      </tr>
    </table>
  </body>
</html>
